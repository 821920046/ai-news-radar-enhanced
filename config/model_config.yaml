# AI News Radar V3 — 模型配置
# 运行时可通过同名环境变量覆盖

openrouter:
  api_url: "https://openrouter.ai/api/v1/chat/completions"
  embeddings_url: "https://openrouter.ai/api/v1/embeddings"

  # TL;DR / 翻译 默认模型（= 下方 models 链的第一个）
  # ⚠️ OpenRouter 会定期撤下 `:free` 变体；改动后请跑 scripts/check_openrouter_models.py
  tldr_model: "qwen/qwen3.8-27b:free"

  # 多模型回退链（环境变量 OPENROUTER_MODELS 可覆盖，逗号分隔）
  # 按「中文效果 / 速度 / 免费额度稳定性 / provider 分散」综合排序
  models:
    - "qwen/qwen3.8-27b:free"                    # 通义千问：中文母语级，EN→ZH 最稳
    - "inclusionai/ling-3.0-flash-sante:free"    # 蚂蚁 Ling 3.0 Flash：中文母语级 + 低延迟
    - "google/gemma-4-31b-it:free"               # Gemma 4 31B：多语言强、指令跟随好
    - "google/gemma-4-26b-a4b-it:free"           # Gemma 4 26B A4B：MoE，3.8B 激活，快
    - "nvidia/nemotron-3-super-120b-a12b:free"   # Nemotron 3 Super：120B MoE / 12B 激活
    - "nvidia/nemotron-3.5-lightning:free"       # Nemotron 3.5 Lightning：3B 激活，高吞吐兜底
    - "dots-studio/dots-3-note-preview:free"     # Dots 3 Note：独立 provider，降低单点拥塞
    - "openrouter/free"                          # 官方免费模型路由器，最后兜底

  # Embedding 模型
  embedding_model: "openai/text-embedding-3-small"

  # 深度分析模型（可选，更贵但更好）
  deep_analysis_model: "anthropic/claude-haiku"

# AI Features（默认关闭，通过环境变量开启）
features:
  tldr_enabled: false
  deep_analysis_enabled: false
  trend_engine_enabled: false

  # 成本控制
  tldr_top_n: 10
  tldr_max_workers: 2
  max_embeddings_per_run: 50

# 翻译
translation:
  api: "https://translate.googleapis.com/translate_a/single"
  max_new_per_run: 80
