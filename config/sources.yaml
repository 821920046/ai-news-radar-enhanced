# AI News Radar V3 — 数据源配置
# 从 core/models.py 的 OFFICIAL_AI_FEEDS 迁移，方便非程序员修改

official_ai_feeds:
  - title: "OpenAI News"
    xml_url: "https://openai.com/news/rss.xml"
    html_url: "https://openai.com/news"
  - title: "Google DeepMind"
    xml_url: "https://deepmind.google/blog/rss.xml"
    html_url: "https://deepmind.google/blog"
  - title: "Hugging Face Blog"
    xml_url: "https://huggingface.co/blog/feed.xml"
    html_url: "https://huggingface.co/blog"

# API 模型配置（可选，运行时从环境变量读取）
# 默认模型链（按中文效果 / 速度 / 免费稳定性排序，前一个不可用/限流时自动回退到下一个）
#
# ⚠️ 这些 `:free` 模型会被 OpenRouter 定期撤下。2026-10-02 已复核：
# 原先的 deepseek-chat-v3-0324 / qwen3-235b-a22b / glm-4.5-air / kimi-k2 / deepseek-r1
# 的 `:free` 变体全部下线，整条链失效。改配置后请跑：
#   python scripts/check_openrouter_models.py
openrouter_default_model: "qwen/qwen3.8-27b:free"
openrouter_models:
  - "qwen/qwen3.8-27b:free"                    # 通义千问：中文母语级，EN→ZH 最稳
  - "google/gemma-4-31b-it:free"               # Gemma 4 31B：多语言强、指令跟随好
  - "nvidia/nemotron-3-super-120b-a12b:free"   # Nemotron 3 Super：120B MoE / 12B 激活
  - "google/gemma-4-26b-a4b-it:free"           # Gemma 4 26B A4B：MoE，3.8B 激活，快
  - "nvidia/nemotron-3.5-lightning:free"       # Nemotron 3.5 Lightning：3B 激活，高吞吐兜底
  - "openrouter/free"                          # 官方免费模型路由器，最后兜底
embedding_model: "openai/text-embedding-3-small"

# Pipeline 默认参数
pipeline:
  window_hours: 24
  archive_days: 3
  translate_max_new: 80
