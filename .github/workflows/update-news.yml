name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # 每 1 小时运行一次

# 修复：原文件里 ${{ }} 被写坏成 "$ github.ref "，concurrency 实际完全失效。
# 另外 cancel-in-progress 改为 false：这个 job 会 git push，
# 中途被杀可能留下半写入的 data/*.json 或未推送的 commit。
concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # archive / trend_history / translation cache are mutable pipeline state,
      # not website output. Keeping them on main adds ~18 MB of JSON churn every
      # hour. Restore the latest snapshot from a one-commit state branch instead.
      - name: Restore pipeline state
        run: |
          set -euo pipefail
          # checkout@v4 uses a single-branch refspec. A plain
          # `git fetch origin pipeline-state` only updates FETCH_HEAD and does
          # NOT create origin/pipeline-state; use an explicit destination ref.
          git fetch --no-tags --depth=1 origin \
            refs/heads/pipeline-state:refs/remotes/origin/pipeline-state || true
          for f in archive.json trend_history.json title-zh-cache.json; do
            if git cat-file -e "origin/pipeline-state:data/$f" 2>/dev/null; then
              git show "origin/pipeline-state:data/$f" > "data/$f"
              echo "restored data/$f"
            fi
          done

      - name: Prepare OPML (optional)
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            if printf '%s' "$FOLLOW_OPML_B64" | tr -d '\r\n ' | base64 --decode > feeds/follow.opml; then
              echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
            else
              rm -f feeds/follow.opml
              echo "::warning::FOLLOW_OPML_B64 is set but is not valid base64; continuing without private OPML"
            fi
          else
            echo "No FOLLOW_OPML_B64 secret provided; RSS OPML is optional"
          fi

      - name: Update data
        env:
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_HTTP_REFERER: ${{ secrets.OPENROUTER_HTTP_REFERER }}
          AI_TLDR_ENABLED: ${{ secrets.AI_TLDR_ENABLED }}
          AI_TLDR_TOP_N: ${{ secrets.AI_TLDR_TOP_N }}
          AI_TLDR_MAX_WORKERS: ${{ secrets.AI_TLDR_MAX_WORKERS }}
          AI_TRANSLATE_ENABLED: ${{ secrets.AI_TRANSLATE_ENABLED }}
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 3 --rss-opml feeds/follow.opml --trend-engine
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 3 --trend-engine
          fi

      - name: Validate output
        run: |
          python - <<'PY'
          import json, sys, datetime
          d = json.load(open('data/latest-24h.json', encoding='utf-8'))
          n = d.get('total_items', 0)
          print(f'AI items: {n}')
          if n < 3:
              sys.exit('ERROR: Too few items, possible source failure')
          # 根因修复：这道门禁原来只数条目数，不看时间。如果采集静默失败、
          # 根本没重写文件，它读到的就是上一次的旧文件，条目数照样合格 ——
          # 于是工作流全绿而数据永远停在某一天。必须校验数据自身的 generated_at。
          gen = d.get('generated_at') or ''
          if not gen:
              sys.exit('ERROR: latest-24h.json has no generated_at')
          age_h = (datetime.datetime.now(datetime.timezone.utc)
                   - datetime.datetime.fromisoformat(gen.replace('Z', '+00:00'))).total_seconds() / 3600
          print(f'generated_at: {gen} ({age_h:.1f} h old)')
          if age_h > 2:
              sys.exit(f'ERROR: pipeline produced stale data ({age_h:.1f} h old); '
                       'it did not rewrite its output this run')
          print('Data quality check passed')
          PY

      - name: Prerender static HTML (SEO + first paint)
        run: python scripts/prerender.py --data data/latest-24h.json --html index.html --top 30

      - name: Save pipeline state (single-commit branch)
        run: |
          set -euo pipefail
          root="$PWD"
          tmp=$(mktemp -d)
          trap 'git worktree remove --force "$tmp" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          git worktree add --detach "$tmp" HEAD
          cd "$tmp"
          git checkout --orphan "pipeline-state-next-${GITHUB_RUN_ID}"
          git rm -rf . >/dev/null
          mkdir -p data
          for f in archive.json trend_history.json title-zh-cache.json; do
            [ -f "$root/data/$f" ] && cp "$root/data/$f" "data/$f"
          done
          git add data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "state: latest pipeline snapshot"
          # Force is intentional: this branch is a mutable snapshot, not history.
          # --force-with-lease prevents overwriting an unexpected concurrent writer.
          old=$(git ls-remote origin refs/heads/pipeline-state | awk '{print $1}')
          if [ -n "$old" ]; then
            git push --force-with-lease="refs/heads/pipeline-state:$old" \
              origin HEAD:refs/heads/pipeline-state
          else
            git push origin HEAD:refs/heads/pipeline-state
          fi

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only commit files the browser actually fetches. Pipeline state is
          # persisted on the single-commit pipeline-state branch above.
          git add -- data/latest-24h.json data/latest-24h-all.json \
                     data/source-status.json data/waytoagi-7d.json \
                     index.html sitemap.xml
          [ -f data/trends.json ] && git add -- data/trends.json || true
          # 修复：原来用 `git diff --quiet` 判断，它只看工作区、看不到已 add 的改动，
          # 会在“有变更但已暂存”时误判为无变更。应该看暂存区。
          if git diff --cached --quiet; then
            # 每小时一跑的流水线必然会改写 source-status.json 里的 generated_at，
            # 因此“定时运行却零变更”不是正常状态，而是流水线没有真正写盘的
            # 信号。以前这里静默 exit 0，把这种故障伪装成了绿色。
            if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
              echo "::error::scheduled run produced no changes at all; the pipeline did not rewrite its output"
              exit 1
            fi
            echo "No changes to commit"; exit 0
          fi
          git commit -m "chore: update ai news snapshot + prerender"
          # 修复：每小时 push 可能和人工提交撞车，直接 push 会 non-fast-forward 失败
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push retry $i"; sleep 5
          done
          echo "::error::push failed after 3 retries"; exit 1

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          # A setup-phase failure is infrastructure, not a data problem, and the
          # retry workflow already recovers it. Alerting on it trains people to
          # ignore alerts, so stay quiet unless repository code actually ran.
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -lt 2 ]; then
            echo "first attempt; letting automatic retry act before alerting"; exit 0
          fi
          # 修复：原来写 `if: failure() && env.WEBHOOK_URL != ''`，但 job 级 if 里读不到
          # step 级 env，条件恒为假，告警从来没发出过。改成在 shell 里判。
          if [ -z "${WEBHOOK_URL:-}" ]; then echo "no WEBHOOK_URL, skip"; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" \
            --data "$(jq -nc --arg t "AI News Radar update failed! Run: $RUN_URL" '{text:$t}')" || true
