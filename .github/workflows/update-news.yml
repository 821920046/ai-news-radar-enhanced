name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # 每 1 小时运行一次

concurrency:
  group: update-ai-news-${{ github.ref }}
  # 必须为 false：这一趟流水线实测要跑 ~20 分钟，而 cron 是每小时触发。
  # 若为 true，下一小时的调度会直接取消正在运行的那一趟，导致数据永远更新不完
  # （此前观察到的 `cancelled` @ 20m19s 就是这个原因，而不是超时）。
  # 排队等待比取消更正确：宁可晚一点，也不要让长任务被腰斩。
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      # 版本固定在当前稳定大版本，避免浮动 tag 带来的意外行为变化。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      # ── 校验 OpenRouter 免费模型是否仍在线 ───────────────────────────────
      # OpenRouter 会定期撤下 `:free` 变体（模型本体还在，只是不再免费）。撤下之后
      # AI 翻译链路会**静默失效** —— 「模型不存在」和「额度耗尽」在日志里长得几乎一样。
      # 实测 2026-10-02 发现内置模型链里的 5 个模型 `:free` 变体全部已下线，而流水线
      # 一直在「正常」运行（AI 翻译 0 条，全部降级 Google）。
      #
      # 这里刻意**只告警、不阻断**：模型下线不该拖垮数据更新，但必须留下可见记录。
      # 退出码 2（网络不通 / 查不了）单独标注 —— 绝不把「无法确定」当成「没问题」。
      - name: Check OpenRouter model availability
        continue-on-error: true
        run: |
          set +e
          python scripts/check_openrouter_models.py --json > /tmp/or_models_check.json
          CODE=$?
          set -e
          case "$CODE" in
            0) echo "::notice::OpenRouter 模型链全部在线且免费" ;;
            1)
              python scripts/check_openrouter_models.py || true
              echo "::warning::OpenRouter 模型链中有模型已下线或已不再免费，请更新 core/utils.py:DEFAULT_OPENROUTER_MODELS 与 config/*.yaml"
              ;;
            *)
              echo "::warning::无法确认 OpenRouter 模型可用性（网络/接口异常）—— 这不代表配置没问题，只是「查不了」"
              ;;
          esac
          if [ -s /tmp/or_models_check.json ]; then
            {
              echo "### OpenRouter 模型可用性（退出码 $CODE）"
              echo '```json'
              cat /tmp/or_models_check.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare OPML (optional)
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            if printf '%s' "$FOLLOW_OPML_B64" | tr -d '\r\n ' | base64 --decode > feeds/follow.opml; then
              echo "Loaded feeds/follow.opml from FOLLOW_OPML_B64 secret"
            else
              rm -f feeds/follow.opml
              echo "::warning::FOLLOW_OPML_B64 is set but is not valid base64; continuing without private OPML"
            fi
          else
            echo "No FOLLOW_OPML_B64 secret provided; RSS OPML is optional"
          fi

      # ── 恢复去重归档（pipeline-state 分支）───────────────────────────────
      # archive.json 约 13.8MB，绝不能放进 main（会持续膨胀仓库）。
      # 但它承载着「这条新闻以前是否见过」的去重历史，丢失会导致重复推送。
      # 之前注释里写着「由 pipeline-state 分支维护」，但**没有任何代码真正读写该
      # 分支**，所以归档在每次 runner 回收后即丢失，归档文件本身也冻结在 2026-08。
      # 这里补上真正的恢复逻辑。
      - name: Restore dedupe archive from pipeline-state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin pipeline-state 2>/dev/null; then
            if git show FETCH_HEAD:data/archive.json > data/archive.json 2>/dev/null \
               && [ -s data/archive.json ]; then
              echo "已恢复 archive.json（$(wc -c < data/archive.json) 字节）"
            else
              echo "pipeline-state 上暂无可用 archive.json，将从空归档开始"
              rm -f data/archive.json
            fi
            git show FETCH_HEAD:data/title-zh-cache.json > data/title-zh-cache.json 2>/dev/null \
              && echo "已恢复 title-zh-cache.json" \
              || rm -f data/title-zh-cache.json
          else
            echo "pipeline-state 分支尚不存在，将从空归档开始"
          fi


      - name: Update data
        # 纵深防御：即使未来某处再引入无界等待，也只损失这一步（20 分钟），
        # 而不是把整个 job 的 40 分钟预算吃光导致后续步骤全被 skip。
        # 实测正常耗时 ~2 分钟；20 分钟给了 10x 余量。
        # 背景：run 36890199782 曾在此步静默卡死 39 分钟（Google 兜底逐条串行 +
        # 3 次重试 × 12s 超时 × 56 条），必须配合 translator.py 的 Google 熔断/预算修复。
        timeout-minutes: 20
        env:
          OPENROUTER_KEYS: ${{ secrets.OPENROUTER_KEYS }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_HTTP_REFERER: ${{ secrets.OPENROUTER_HTTP_REFERER }}
          AI_TLDR_ENABLED: ${{ secrets.AI_TLDR_ENABLED }}
          AI_TLDR_TOP_N: ${{ secrets.AI_TLDR_TOP_N }}
          AI_TLDR_MAX_WORKERS: ${{ secrets.AI_TLDR_MAX_WORKERS }}
          AI_TRANSLATE_ENABLED: ${{ secrets.AI_TRANSLATE_ENABLED }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
          WEBHOOK_MODE: ${{ secrets.WEBHOOK_MODE }}
          WEBHOOK_HOTNESS_THRESHOLD: ${{ secrets.WEBHOOK_HOTNESS_THRESHOLD }}
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 3 --rss-opml feeds/follow.opml
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 3
          fi

      - name: Validate output
        run: python scripts/validate_data.py --data-dir data --max-age-hours 6

      # ── 新增：构建期静态预渲染（SSG），把首屏新闻写进 index.html ──
      # base-url 必须是对外自定义域名：sitemap 与 canonical/og:url 都用它，
      # 写错会让搜索引擎收录到跳转前的地址（此前一直是 github.io 地址）。
      - name: Prerender static HTML (SEO + first paint)
        run: |
          python scripts/prerender.py --data data/latest-24h.json --html index.html \
            --top 30 --base-url "https://news.my-tv.eu.cc"

      # ── 对外出口：llms.txt（给大模型）、三版 RSS、robots.txt ──
      # 纯静态产物，由 GitHub Pages 托管，零成本。失败不阻断主流程：
      # 这些是「扩大受众」的增量出口，不该拖垮数据更新。
      #
      # base-url 必须用**对外自定义域名**。站点实际服务在 news.my-tv.eu.cc
      # （Cloudflare 代理），用 github.io 的地址会 301 跳转，
      # 导致 RSS 里的 self 链接与 llms.txt 里的入口全部指向跳转前的地址。
      - name: Build agent-facing outputs (llms.txt + RSS)
        run: |
          python scripts/build_feeds.py --data data/latest-24h.json \
            --base-url "https://news.my-tv.eu.cc" \
            --out-dir . || echo "::warning::对外出口生成失败（不影响数据更新）"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 只 add 明确需要提交的文件。archive.json / title-zh-cache.json 由 .gitignore 排除
          # 并由 pipeline-state 分支维护：`git add` 一个被忽略的路径会直接以 exit 1 失败
          # （"The following paths are ignored by one of your .gitignore files"），
          # 这正是此前每次运行都在本步骤挂掉的原因。
          git add data/latest-24h.json data/latest-24h-all.json data/source-status.json data/waytoagi-7d.json index.html llms.txt robots.txt feed-hot.xml feed-all.xml feed-daily.xml

          # ── 抑制无意义快照（仓库负担的根因）──────────────────────────────
          # generated_at 每次都会变，导致 JSON 至少有 1 字节差异 —— 于是每个小时
          # 都会产生一个新提交，把 2.6MB + 4.3MB 两个 JSON 各写入一遍。一千多次之后
          # .git 就膨胀到 GB 级。
          #
          # 注意：不能用 `git diff | grep -v generated_at` 来判断。这些 JSON 是
          # **单行** 文件，生成时间与真实条目内容同处一行，按行过滤会把真正的变化
          # 一并丢弃，从而漏掉应当提交的更新。这里交给 snapshot_fingerprint.py 做
          # JSON 语义级比较：剔除 generated_at 后取哈希，与 HEAD 版本比对。
          #   退出码 0 = 有实质变化；3 = 所有快照都只是 generated_at 不同。
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          set +e
          python scripts/snapshot_fingerprint.py \
            --files data/latest-24h.json data/latest-24h-all.json \
                    llms.txt feed-hot.xml feed-all.xml feed-daily.xml
          FP_EXIT=$?
          set -e

          if [ "$FP_EXIT" -eq 3 ]; then
            # JSON 快照无实质变化。仅当非 JSON 产物（预渲染 HTML / 信源状态 /
            # 7 日榜）确实变了时才继续提交。
            if git diff --cached --quiet -- index.html data/source-status.json data/waytoagi-7d.json; then
              echo "Snapshot content unchanged and no artifact changes; skipping commit to avoid repo bloat."
              exit 0
            fi
            echo "JSON snapshots unchanged, but other artifacts changed; committing."
          fi

          git commit -m "chore: update ai news snapshot + prerender"

          # ── 推送到远端 ───────────────────────────────────────────────────
          # 不能写成 `git pull --rebase || true`：一旦工作区存在任何未暂存改动，
          # rebase 会直接以 "cannot pull with rebase: You have unstaged changes"
          # 失败，而 `|| true` 把它吞掉 —— 于是实际上从未 rebase，紧接着的
          # git push 会在远端已前进时被拒绝。实测在 run 36877776289 中已出现
          # 该错误（被掩盖，恰好当时远端未前进才侥幸成功）。
          #
          # 正确做法：先把工作区收拾干净，再 rebase，失败则明确报错。
          git stash push --include-untracked -m "ci-autostash" >/dev/null 2>&1 || true

          if ! git pull --rebase origin main; then
            echo "::error::rebase 失败，终止以避免产生分叉或覆盖远端提交"
            git rebase --abort 2>/dev/null || true
            exit 1
          fi

          if ! git push; then
            echo "::error::推送失败（可能是并发运行抢占了远端）"
            exit 1
          fi

      # ── 保存去重归档回 pipeline-state ────────────────────────────────────
      # 与 main 完全解耦：archive.json 只在 branch 之间流转，永不进入 main 历史，
      # 因此它 13.8MB 的体积不会拖累仓库。用独立分支还带来一个好处：
      # 归档的每次覆盖不会产生 main 上的提交（分支本身是可丢弃的派生状态）。
      - name: Persist dedupe archive to pipeline-state
        if: success()
        run: |
          set -euo pipefail
          if [ ! -s data/archive.json ]; then
            echo "无 archive.json 可保存（本次可能未生成），跳过"
            exit 0
          fi

          # 归档体积超过 GitHub 单文件 100MB 硬限制时会被拒绝推送。
          # 正常情况下 --archive-days 3 远低于该阈值，这里只做兜底告警。
          SIZE=$(wc -c < data/archive.json)
          echo "archive.json 大小: $SIZE 字节"
          if [ "$SIZE" -gt 90000000 ]; then
            echo "::warning::archive.json 已达 $SIZE 字节，接近 100MB 限制，请检查保留策略"
          fi

          # 用 /tmp 下的独立浅克隆操作，而不是 worktree：
          # worktree 会把分支「登记」在主仓库里，一旦上次运行残留注册，
          # `git worktree add -B <branch>` 会直接报
          # "cannot force update the branch ... used by worktree" 而失败。
          # 独立克隆与主仓库完全解耦，无此类状态可残留。
          rm -rf /tmp/pipeline-state
          if git clone --depth=1 --branch pipeline-state \
               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
               /tmp/pipeline-state 2>/dev/null; then
            echo "已克隆 pipeline-state"
          else
            echo "pipeline-state 尚不存在，将初始化一个新分支"
            mkdir -p /tmp/pipeline-state
            git -C /tmp/pipeline-state init -q
            git -C /tmp/pipeline-state remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -C /tmp/pipeline-state checkout -q -b pipeline-state
          fi

          # 该分支只承载派生状态，不需要主仓库的 .gitignore：
          # 移除它，避免被忽略的归档文件无法 add。
          mkdir -p /tmp/pipeline-state/data
          rm -f /tmp/pipeline-state/.gitignore
          cp data/archive.json /tmp/pipeline-state/data/archive.json
          [ -s data/title-zh-cache.json ] && \
            cp data/title-zh-cache.json /tmp/pipeline-state/data/title-zh-cache.json || true
          [ -s data/trend_history.json ] && \
            cp data/trend_history.json /tmp/pipeline-state/data/trend_history.json || true

          cd /tmp/pipeline-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/archive.json
          [ -f data/title-zh-cache.json ] && git add -f data/title-zh-cache.json || true
          [ -f data/trend_history.json ] && git add -f data/trend_history.json || true

          if git diff --cached --quiet; then
            echo "归档无变化，跳过推送"
            exit 0
          fi

          git commit -q -m "chore(pipeline-state): refresh dedupe archive [skip ci]"
          if git push origin HEAD:refs/heads/pipeline-state; then
            echo "已更新 pipeline-state"
          else
            # 归档是去重优化的辅助状态，推送失败只降级为重复推送风险，
            # 不应把一次成功的新闻更新判为失败。
            echo "::warning::pipeline-state 推送失败（并发运行或权限不足）；本次归档未保存"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 数据陈旧看门狗：流水线「成功」但数据其实没更新 ──────────────────
      # 最隐蔽的失败模式：所有信源抓取失败 / 运行时间不足 / 上游 API 静默降级时，
      # 管道仍以 exit 0 结束，站点继续展示过期新闻，而 Actions 一片绿。
      # 这里在 push 之后复核数据新鲜度，超阈值就走企微告警。
      - name: Staleness watchdog
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
        run: |
          python scripts/notify_ci.py --mode stale --data-dir data --max-age-hours 6 \
            || echo "::warning::陈旧告警发送失败（不影响本次运行结论）"

      # ── 失败/取消/超时告警（企业微信）──────────────────────────────────
      # 覆盖任意步骤失败。if 用 `!success()` 而非 `failure()`：
      # cancelled / timed_out 不是 failure，但同样需要有人知道。
      - name: Notify on failure
        if: ${{ !success() }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
        run: |
          python scripts/notify_ci.py \
            --mode ci \
            --status "${{ job.status }}" \
            --data-dir data \
            --detail "工作流：${{ github.workflow }}" \
            || echo "::warning::失败告警发送失败（不影响本次运行结论）"
