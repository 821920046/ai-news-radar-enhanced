name: Retry Transient Failures

# A job that fails inside "Set up job" never executed repository code: the
# runner was still resolving the actions listed in `uses:`. GitHub retries that
# resolution twice internally and then fails the job permanently, with no
# built-in job-level retry. This workflow supplies the missing recovery.
#
# This workflow deliberately declares ZERO `uses:` steps. A recovery mechanism
# must not share the failure mode it exists to recover from: if action
# resolution is returning 503, a checkout step here would fail for exactly the
# same reason and recovery would vanish precisely when it is needed. The `gh`
# CLI, `jq` and `git` are preinstalled on GitHub-hosted runners, so the decision
# script is fetched over the plain REST API instead, keeping one copy of the
# logic in the repository.
on:
  # 只监听**一个**工作流，且只监听关键路径。
  #
  # 曾同时监听 Deploy / Update / Cleanup 三个，但它们是**链式**的：
  #   Update 完成 → Deploy 完成 → Cleanup 完成
  # 而 GitHub 的 workflow_run **没有按 conclusion 过滤的能力**（只支持
  # workflows / types / branches），所以每一次「完成」都必然创建一个运行记录，
  # 再靠 job 级 if 跳过。结果：每个小时周期产生 3 次运行，实测 1964 次里
  # 88% 是 skipped 空跑，把 Actions 列表刷得没法看。
  #
  # 收敛到 Update 之后：72 次/天 → 24 次/天，且保留秒级即时反应。
  # Deploy / Cleanup 的瞬时故障不再即时重试，但两者都有每小时的自愈路径
  # （下一次 Update 会再次触发 Deploy；Cleanup 另有每日 schedule 兜底）。
  workflow_run:
    workflows:
      - "Update AI News Snapshot"
    types: [completed]

permissions:
  contents: read
  actions: write   # required to request a re-run

# Never process the same failed run twice concurrently.
concurrency:
  group: retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    # Cheap pre-filter; the script re-validates everything itself.
    # GitHub 的运行结论不只有 failure。当 "Set up job" 阶段彻底失败时，整次运行常被判为
    # startup_failure；运行器被回收则得到 timed_out。
    #
    # cancelled 也必须放进来 —— GitHub 把「job 超出 timeout-minutes」也报成
    # cancelled（本仓库 0 个 timed_out、271 个 cancelled，且每个 cancelled 都恰好
    # 停在超时线上）。把它挡在门外，等于对唯一真实发生的故障类型完全失明。
    # 判定「超时 kill 还是人的决定」需要读运行时长与工作流文件，表达不了在 if 里，
    # 所以这里放行、由脚本判定并留下日志。
    if: >-
      contains(fromJSON('["failure","startup_failure","timed_out","cancelled"]'),
               github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch decision script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Always the default branch: the script must be the reviewed version,
          # never whatever a feature branch happened to contain.
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p tools/ci

          # Fetch the JSON form, not the raw form. Raw bytes carry no integrity
          # information, and a truncated shell script is still syntactically
          # valid: `bash -n` would pass while the recovery logic silently
          # disappeared. The JSON form carries `size` and the git blob `sha`,
          # which make completeness verifiable rather than assumed.
          gh api "/repos/$REPO/contents/tools/ci/retry_transient_failure.sh?ref=$REF" \
            > /tmp/script_meta.json

          jq -r '.content' /tmp/script_meta.json | base64 -d \
            > tools/ci/retry_transient_failure.sh

          expected_size=$(jq -r '.size' /tmp/script_meta.json)
          expected_sha=$(jq -r '.sha' /tmp/script_meta.json)
          actual_size=$(wc -c < tools/ci/retry_transient_failure.sh)
          # A git blob sha is computed over the object header plus content,
          # which is exactly what `git hash-object` reproduces.
          actual_sha=$(git hash-object tools/ci/retry_transient_failure.sh)

          if [ "$actual_size" != "$expected_size" ]; then
            echo "::error::size mismatch: got $actual_size, expected $expected_size"; exit 1
          fi
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::checksum mismatch: got $actual_sha, expected $expected_sha"; exit 1
          fi

          bash -n tools/ci/retry_transient_failure.sh
          chmod +x tools/ci/retry_transient_failure.sh
          echo "verified $actual_size bytes, blob $actual_sha"

      - name: Evaluate and re-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          # Guard against ever watching itself: that would be a self-feeding
          # loop no attempt cap could bound, because each retry run is a new
          # run with attempt 1.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
          # 判定「超时 kill」时要读工作流文件里的 timeout-minutes，必须钉在默认分支，
          # 否则会读到特性分支上未经审查的值。
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_ATTEMPTS: "3"
          # 超时 kill 单独设更小的重试上限：见脚本内注释。
          MAX_TIMEOUT_ATTEMPTS: "2"
        run: ./tools/ci/retry_transient_failure.sh
