name: Deploy to GitHub Pages

on:
  # 只在“内容真正变了”的时候部署；避免每次 push 都排队
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/latest-24h.json"
      - "data/latest-24h-all.json"
      - "data/source-status.json"
      - "data/waytoagi-7d.json"
      - "data/trends.json"
      - "manifest.json"
      - "sw.js"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy-pages.yml"
  # 根因修复：上面的 push 触发器对每小时的数据更新永远不会生效。
  # GitHub 规定“使用默认 GITHUB_TOKEN 推送的提交不会创建新的工作流运行”
  # （官方为防止工作流互相触发导致无限递归而设的硬性限制）。
  # update-news.yml 正是用默认 GITHUB_TOKEN push 数据的，所以它每小时的
  # commit 不产生 push 事件 -> Pages 从不部署 -> 采集全绿、站点却停在
  # 最后一次人工部署的日期。这是“所有工作流都是绿的，但页面是旧的”的原因。
  #
  # workflow_run 监听的是“工作流运行结束”这个事件，不是 push 事件，
  # 因此不受 GITHUB_TOKEN 限制，是官方文档给出的标准解法。
  # 注意：workflows 里的名字必须与目标工作流 name: 字段逐字相同，写错则静默不触发。
  workflow_run:
    workflows: ["Update AI News Snapshot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 关键 1：Pages 部署全局串行，且不要取消正在进行的部署
# cancel-in-progress: true 会把已经 Created 的 deployment 变成“孤儿”，
# 后续 deployment 只能排队 -> 表现为一直 deployment_in_progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 把本次发布的数据时间戳交给 deploy 之后的 verify 作业核对。
    outputs:
      generated_at: ${{ steps.assemble.outputs.generated_at }}
    # 采集失败时不要把可能残缺的数据发布上线。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # 必须取默认分支的最新 HEAD，绝不能写成 ref: github.event.workflow_run.head_sha。
      # workflow_run 的 head_sha 是“触发上游那次运行的提交”，也就是数据更新之前的
      # 提交；用它 checkout 会发布旧数据，等于把刚修好的这个 bug 原样复现一遍。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref }}

      - name: Assemble site (只打包前端需要的文件)
        id: assemble
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site/assets _site/data
          cp index.html manifest.json sw.js robots.txt sitemap.xml _site/
          cp -r assets/. _site/assets/
          # assets/log.png (1.5MB) 在前端无任何引用，不发布
          rm -f _site/assets/log.png
          # 关键 2：只发布前端真正会 fetch 的数据，archive.json / trend_history.json
          # 这类 16MB+ 的历史文件不要进 artifact
          for f in latest-24h.json latest-24h-all.json source-status.json \
                   waytoagi-7d.json trends.json; do
            [ -f "data/$f" ] && cp "data/$f" _site/data/ || true
          done
          # 关键 3：禁用 Jekyll，否则 _headers 等下划线开头的文件会被吞掉
          touch _site/.nojekyll

          # 自定义域名必须随每份 Pages artifact 发布，否则配置可能被冲掉。
          echo "news.my-tv.eu.cc" > _site/CNAME

          # Service Worker 缓存版本注入：sw.js 里 CACHE 是硬编码的，
          # 每小时更新的站点不 bump 版本号，老用户会一直看到缓存的旧快照。
          sed -i "s/^const CACHE = .*/const CACHE = 'ai-news-radar-${GITHUB_SHA::7}';/" _site/sw.js
          grep -n "^const CACHE" _site/sw.js

          # 发布前最后一道门：拒绝空文件、坏 JSON、错误域名和意外的大包。
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('_site')
          for p in root.joinpath('data').glob('*.json'):
              if p.stat().st_size == 0:
                  sys.exit(f'empty file: {p}')
              try: json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: sys.exit(f'invalid JSON {p}: {e}')

          # 记下数据自身的 generated_at，交给 verify 作业核对“线上真正被
          # 服务的内容 == 本次发布的内容”。
          import datetime, os
          main = root / 'data' / 'latest-24h.json'
          if not main.exists():
              sys.exit('data/latest-24h.json missing; refusing to publish a site without data')
          gen = json.loads(main.read_text(encoding='utf-8')).get('generated_at') or ''
          if not gen:
              sys.exit('latest-24h.json has no generated_at; freshness cannot be verified')
          age_h = (datetime.datetime.now(datetime.timezone.utc)
                   - datetime.datetime.fromisoformat(gen.replace('Z', '+00:00'))).total_seconds() / 3600
          print(f'data generated_at: {gen} ({age_h:.1f} h old)')
          # 只告警不阻断：数据旧不应该阻止发布，但必须在日志里显式喊出来。
          if age_h > 6:
              print(f'::warning::published data is {age_h:.1f} h old; check Update AI News Snapshot')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'generated_at={gen}\n')

          if root.joinpath('CNAME').read_text().strip() != 'news.my-tv.eu.cc':
              sys.exit('invalid CNAME')
          size = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'site size: {size/1024/1024:.1f} MB')
          if size > 25 * 1024 * 1024:
              sys.exit('site unexpectedly exceeds 25 MB')
          PY

          echo "--- site tree ---"; find _site -type f | wc -l; du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # 根因修复：Pages artifact 只在本次 run 内有用，默认 90 天保留是纯浪费。
          # 每小时一份 × 90 天 = 2160 份堆积。定时清理只是兼底，这里才是源头。
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
          error_count: 10

  # 本轮根因修复：以前整条链条只验证“我们发布了什么”，从不验证“线上真正被
  # 服务的是什么”。这两者可以长期不一致而全程绿灯，例如：
  #   • Settings -> Pages -> Source 仍为 "Deploy from a branch"，此时对外
  #     服务的是分支构建器（pages-build-deployment）产出的旧站点，
  #     本工作流的 artifact 部署再成功也不会生效；
  #   • CNAME 被冲掉、CDN/边缘缓存未失效。
  # 加一道出站核对，把“发布成功但没生效”这类静默故障变成红色。
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 分层定位第一步：直接问 GitHub 自己的 Pages 配置，这是权威来源，
      # 比看工作流颜色可靠。build_type 不是 workflow 就说明对外服务的
      # 根本不是本工作流的 artifact。同时抓自定义域名的响应头，
      # 用 cf-cache-status / age 分辨“源站旧”还是“边缘缓存旧”。
      - name: Diagnose the serving layer
        id: diag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ needs.build.outputs.generated_at }}
          SITE_HOST: news.my-tv.eu.cc
        run: |
          set -uo pipefail
          echo "expected (本次发布): $EXPECTED"

          echo ""
          echo "===== 实验 1：GitHub Pages 配置（权威来源）====="
          if gh api "/repos/${{ github.repository }}/pages" > /tmp/pages.json 2>/tmp/pages.err; then
            cat /tmp/pages.json
          else
            echo "cannot read pages config: $(cat /tmp/pages.err)"
            echo '{}' > /tmp/pages.json
          fi

          echo ""
          echo "===== 实验 2：绕过 DNS 与 Cloudflare，直连 GitHub Pages 源站 ====="
          # --resolve 强制把域名指向 GitHub Pages 官方 IP，Host 与 SNI 仍为真域名，
          # 因此这是“源站到底存不存在新数据”的直接实验，不受 DNS/CDN 干扰。
          : > /tmp/origin.txt
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            code=$(curl -sS -o /tmp/o.json -w '%{http_code}' --max-time 20 \
              --resolve "$SITE_HOST:443:$ip" \
              "https://$SITE_HOST/data/latest-24h.json?cb=${GITHUB_RUN_ID}-$ip" 2>/dev/null || echo 000)
            g=$(python3 -c "import json;print(json.load(open('/tmp/o.json')).get('generated_at',''))" 2>/dev/null || true)
            echo "origin $ip -> HTTP $code  generated_at=${g:-<none>}"
            if [ -n "${g:-}" ]; then echo "$g" >> /tmp/origin.txt; fi
          done

          echo ""
          echo "===== 实验 3：域名当前实际响应头 ====="
          curl -sSI --max-time 20 "https://$SITE_HOST/data/latest-24h.json" 2>/dev/null \
            | tr -d '\r' > /tmp/head.txt || true
          grep -iE '^(HTTP|server|age|cf-cache-status|cf-ray|cache-control|last-modified|x-github-request-id|via|x-served-by)' /tmp/head.txt || cat /tmp/head.txt
          curl -sS --max-time 20 "https://$SITE_HOST/data/latest-24h.json?cb=${GITHUB_RUN_ID}-dom" \
            -o /tmp/dom.json 2>/dev/null || true
          echo "domain generated_at=$(python3 -c "import json;print(json.load(open('/tmp/dom.json')).get('generated_at',''))" 2>/dev/null || true)"

          echo ""
          echo "===== 汇总判定 ====="
          python3 - <<'PY'
          import json, os, pathlib

          expected = os.environ.get('EXPECTED', '')
          def read(p, default=''):
              try: return pathlib.Path(p).read_text(encoding='utf-8', errors='replace')
              except Exception: return default

          try: pages = json.loads(read('/tmp/pages.json', '{}') or '{}')
          except Exception: pages = {}
          build_type = pages.get('build_type')
          cname = pages.get('cname')

          origin = [l.strip() for l in read('/tmp/origin.txt').splitlines() if l.strip()]
          head = read('/tmp/head.txt').lower()
          try: domain = json.loads(read('/tmp/dom.json', '{}') or '{}').get('generated_at', '')
          except Exception: domain = ''

          origin_fresh = expected in origin
          origin_any = bool(origin)
          domain_fresh = (domain == expected)
          is_github = 'x-github-request-id' in head
          is_cf = ('cf-ray' in head) or ('server: cloudflare' in head)

          print('build_type   :', build_type)
          print('pages cname  :', cname)
          print('origin 直连   :', origin or '<全部失败/无数据>')
          print('origin 是新的:', origin_fresh)
          print('domain       :', domain or '<none>', '是新的:', domain_fresh)
          print('域名背后有 GitHub 特征头:', is_github, ' 有 Cloudflare 特征头:', is_cf)

          if build_type and build_type != 'workflow':
              c = ('A层 Pages 部署源是"%s"（分支模式），不是 GitHub Actions。'
                   '修法：Settings -> Pages -> Source = GitHub Actions' % build_type)
          elif origin_fresh and not domain_fresh:
              c = ('C层 GitHub Pages 源站已经是新数据，但域名返回的是旧数据：'
                   '说明访问该域名的流量根本没有到 GitHub Pages。'
                   '最常见：存在一个 Cloudflare Pages / Workers 项目（或其它托管）'
                   '占用了 news.my-tv.eu.cc 这个自定义域名，它优先接管了请求。'
                   '去 Cloudflare 看 Workers & Pages 里是不是有个旧项目绑了这个域名，'
                   '或 DNS 里该记录指向的不是 <user>.github.io。')
          elif origin_any and not origin_fresh:
              c = ('B层 GitHub Pages 源站本身返回的就是旧内容（origin=%s）：'
                   'artifact 虽然部署成功，但未成为对外服务的那份。'
                   '检查 Settings -> Pages 是否有另一个部署源，'
                   '以及是否存在 gh-pages 分支在并行发布。' % origin[0])
          elif not origin_any:
              c = ('D层 无法从 GitHub Pages 官方 IP 取到该域名的内容：'
                   'GitHub Pages 可能没有绑定这个自定义域名（看上面 pages cname）。')
          else:
              c = '无异常：源站与域名都是新数据。'

          print('结论:', c)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('conclusion=' + c.replace('\n', ' ') + '\n')
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a', encoding='utf-8') as fh:
              fh.write('### 分层诊断结论\n\n' + c + '\n')
          PY

      # 该域名走 Cloudflare 代理，而仓库里的 _headers 在 GitHub Pages 上不生效，
      # 因此 /data/*.json 没有任何源站缓存策略约束。发完就主动清一次边缘缓存，
      # 这是 B 层的根治办法（客户端发 Cache-Control: no-cache 对 Cloudflare 无效）。
      - name: Purge Cloudflare edge cache (optional)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "::warning::未配置 CF_API_TOKEN / CF_ZONE_ID，跳过 Cloudflare 缓存清除。"
            echo "::warning::该域名走 Cloudflare 代理，不清边缘缓存时新数据可能长时间不生效。"
            exit 0
          fi
          s="https://news.my-tv.eu.cc"
          payload=$(printf '{"files":["%s/","%s/index.html","%s/sw.js","%s/data/latest-24h.json","%s/data/latest-24h-all.json","%s/data/source-status.json","%s/data/waytoagi-7d.json","%s/data/trends.json"]}' "$s" "$s" "$s" "$s" "$s" "$s" "$s" "$s")
          code=$(curl -sS -o /tmp/cf.json -w '%{http_code}' --max-time 60 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" --data "$payload")
          cat /tmp/cf.json; echo
          if [ "$code" != "200" ] || ! python3 -c 'import json,sys; sys.exit(0 if json.load(open("/tmp/cf.json")).get("success") else 1)'; then
            echo "::error::Cloudflare 缓存清除失败 (HTTP $code)；请检查 token 权限与 zone id"
            exit 1
          fi
          echo "Cloudflare edge cache purged"
          sleep 10

      - name: Verify the live site serves exactly what we just published
        env:
          EXPECTED: ${{ needs.build.outputs.generated_at }}
          SITE: https://news.my-tv.eu.cc
          DIAG: ${{ steps.diag.outputs.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ]; then
            echo "::error::build did not report generated_at; cannot verify the live site"
            exit 1
          fi
          echo "expected generated_at: $EXPECTED"
          # Pages 发布到边缘生效有传播延迟，重试而不是一次定生死。
          for i in 1 2 3 4 5 6; do
            # 把 HTTP 状态码与 curl 退出码分开记录，绝不把不同病因压成同一个 <none>。
            out=$(curl -sS -o /tmp/live.json -w '%{http_code}' --max-time 30 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "$SITE/data/latest-24h.json?cb=${GITHUB_RUN_ID}-$i" 2>/tmp/curl.err; echo "|$?")
            cexit=${out##*|}
            code=${out%|*}
            served=$(python3 -c "import json;print(json.load(open('/tmp/live.json')).get('generated_at',''))" 2>/dev/null || true)
            echo "attempt $i: HTTP ${code:-000}  curl_exit=${cexit}  served=${served:-<none>}"
            if [ -z "${served:-}" ]; then
              if [ -s /tmp/curl.err ]; then
                echo "  curl 说: $(tr -d '\r' < /tmp/curl.err | head -2 | tr '\n' ' ')"
              fi
              case "${code:-000}" in
                000)
                  echo "  判读：连接阶段就失败了。curl_exit=6 是 DNS 解析不到（很可能解绑自定义域名时连 DNS 记录一起被删了），"
                  echo "        curl_exit=35/60 是 TLS/证书问题，curl_exit=28 是超时。"
                  ;;
                404)
                  echo "  判读：DNS 通了、请求到达了服务端，但对方说没有这个站点。"
                  echo "        最常见：GitHub Settings -> Pages -> Custom domain 里还没填 news.my-tv.eu.cc，"
                  echo "        GitHub Pages 认不出这个 Host，因此直接返回 404。"
                  ;;
                52[0-9])
                  echo "  判读：Cloudflare 连不上源站（${code}）。525/526 通常是 SSL/TLS 加密模式不对，"
                  echo "        把 SSL/TLS -> Overview 设为 Full（不要用 Flexible）。"
                  ;;
                20*)
                  echo "  判读：HTTP $code 取到了内容，但不是合法 JSON 或缺 generated_at 字段。"
                  echo "        前 200 字节：$(head -c 200 /tmp/live.json | tr -d '\n')"
                  ;;
                *)
                  echo "  判读：服务端返回 HTTP $code。"
                  ;;
              esac
            fi
            if [ "${served:-}" = "$EXPECTED" ]; then
              echo "live site matches the published artifact"
              exit 0
            fi
            sleep 20
          done
          echo "::error::【自动判定结论】$DIAG"
          echo "::error::  • build_type 不是 workflow → A 层：改 Settings -> Pages -> Source = GitHub Actions"
          echo "::error::  • build_type 是 workflow 但 cf-cache-status: HIT/age 很大 → B 层：Cloudflare 边缘缓存"
          echo "::error::    配 CF_API_TOKEN / CF_ZONE_ID 两个 secret 后本工作流会自动清缓存，"
          echo "::error::    并在 Cloudflare 加一条 Cache Rule：/data/* → Bypass cache"
          echo "::error::线上服务的数据与本次发布不一致（expected $EXPECTED）。"
          echo "::error::最常见原因：Settings -> Pages -> Source 不是 \"GitHub Actions\"，"
          echo "::error::此时对外服务的是分支构建器的旧站点，本工作流再绿也不会生效。"
          exit 1
